[project]
name = "powerspec"
version = "0.1.1"
description = "Profile-driven project guidance and skill resolution"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "ruamel-yaml>=0.18,<0.19",
    "saucepan-sdk @ git+https://github.com/ZackaryW/saucepan@4e22ad00722b7d6511f83d8b89bbbd9aa3f3caff#subdirectory=sdk/python",
    "tomlkit>=0.13,<1",
    "typer>=0.27.2",
    "zuat @ git+https://github.com/ZackaryW/zuat@e42dbfe64f071da145dc33d728f92ef6edd1195b",
    "zuu @ git+https://github.com/ZackaryW/zuu@731be142933d05fe06697c17c1083c4ea2fb5f12",
]

[project.scripts]
pspec = "powerspec.cli:main"
powerspec = "powerspec.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "zuu>=202609.8,<202610"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.hooks.custom.source]
owner = "Fission-AI"
repository = "OpenSpec"
revision = "db2309783547a14e150dbcbfc19120e4028446c3"
license = "LICENSE"
skills = [
    "openspec-apply-change",
    "openspec-archive-change",
    "openspec-bulk-archive-change",
    "openspec-continue-change",
    "openspec-explore",
    "openspec-ff-change",
    "openspec-new-change",
    "openspec-onboard",
    "openspec-propose",
    "openspec-sync-specs",
    "openspec-update-change",
    "openspec-verify-change",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/powerspec"]

[tool.hatch.build.targets.wheel.force-include]
".pspec" = "powerspec/_resources/catalog"
"LICENSE" = "powerspec/_resources/LICENSE"

[tool.hatch.build.targets.sdist]
include = [
    "/src/powerspec",
    "/.pspec",
    "/tests",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/hatch_build.py",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pytest>=9.1.1",
]
