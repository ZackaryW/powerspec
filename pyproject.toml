[project]
name = "powerspec"
version = "0.1.6"
description = "Profile-driven project guidance and skill resolution"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "ruamel-yaml>=0.18,<0.19",
    "saucepan-sdk @ git+https://github.com/ZackaryW/saucepan@324282bac14fd0e0032a07e0fbed85ee95447dbb#subdirectory=sdk/python",
    "tomlkit>=0.13,<1",
    "typer>=0.27.2",
    "zuat @ git+https://github.com/ZackaryW/zuat@b2cb2dc72d31a0aed5b55d5597fc2f56e3017941",
    "zuu @ git+https://github.com/ZackaryW/zuu@731be142933d05fe06697c17c1083c4ea2fb5f12",
]

[project.scripts]
pspec = "powerspec.cli:main"
powerspec = "powerspec.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "zuu>=202609.8,<202610"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.hooks.custom.source]
owner = "Fission-AI"
repository = "OpenSpec"
revision = "c794978f4f8845ce59693373c9dd882ee776588c"
license = "LICENSE"
skills = [
    "openspec-apply-change",
    "openspec-archive-change",
    "openspec-bulk-archive-change",
    "openspec-continue-change",
    "openspec-explore",
    "openspec-ff-change",
    "openspec-new-change",
    "openspec-onboard",
    "openspec-propose",
    "openspec-sync-specs",
    "openspec-update-change",
    "openspec-verify-change",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/powerspec"]

[tool.hatch.build.targets.wheel.force-include]
".pspec" = "powerspec/_resources/catalog"
"LICENSE" = "powerspec/_resources/LICENSE"

[tool.hatch.build.targets.sdist]
include = [
    "/src/powerspec",
    "/.pspec",
    "/tests",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/hatch_build.py",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pytest>=9.1.1",
]
