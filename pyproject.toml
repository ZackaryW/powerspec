[project]
name = "powerspec"
version = "0.1.0"
description = "Profile-driven project guidance and skill resolution"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml==6.0.3",
    "ruamel-yaml>=0.18,<0.19",
    "typer>=0.27.2",
    "zuat",
    "zuu",
]

[project.scripts]
pspec = "powerspec.cli:main"
powerspec = "powerspec.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
zuu = { git = "https://github.com/ZackaryW/zuu", rev = "731be142933d05fe06697c17c1083c4ea2fb5f12" }
zuat = { git = "https://github.com/ZackaryW/zuat", rev = "e42dbfe64f071da145dc33d728f92ef6edd1195b" }
