[project]
name = "powerspec"
version = "0.1.0"
description = "Profile-driven project guidance and skill resolution"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml==6.0.3",
    "ruamel-yaml>=0.18,<0.19",
    "typer>=0.27.2",
    "zuat @ git+https://github.com/ZackaryW/zuat@e42dbfe64f071da145dc33d728f92ef6edd1195b",
    "zuu @ git+https://github.com/ZackaryW/zuu@731be142933d05fe06697c17c1083c4ea2fb5f12",
]

[project.scripts]
pspec = "powerspec.cli:main"
powerspec = "powerspec.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/powerspec"]

[tool.hatch.build.targets.wheel.force-include]
".pspec" = "powerspec/_resources/catalog"
"LICENSE" = "powerspec/_resources/LICENSE"

[tool.hatch.build.targets.sdist]
include = [
    "/src/powerspec",
    "/.pspec",
    "/tests",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
