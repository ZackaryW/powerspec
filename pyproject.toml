[project]
name = "powerspec"
version = "0.1.0"
description = "Profile-driven project guidance and skill resolution"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
pspec = "powerspec.cli:main"
powerspec = "powerspec.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
