version = 2
entry = "SKILL.md"

# SKILL.md owns the shared flow; only dynamic additions are declared here.
# The consuming profile or project can supply language; otherwise ask.
[[input]]
id = "language"
type = "string"

[input.parser]
type = "prompt"
prompt = "Which language applies to this TDD segment?"

# Tooling is needed only by the Python additions. Configured values skip prompts.
# Defaults belong to the consuming profile; this skill does not assume a toolchain.
[[input]]
id = "build_tool"
type = "string"
when = { language = "python" }

[input.parser]
type = "prompt"
prompt = "Which build/environment tool does this Python project use?"

[[input]]
id = "test_runner"
type = "string"
when = { language = "python" }

[input.parser]
type = "prompt"
prompt = "Which test runner does this Python project use?"

[[input]]
id = "test_command"
type = "string"
when = { language = "python" }

[input.parser]
type = "prompt"
prompt = "What command runs tests in this Python project's environment?"

# Insert after the named section's body, before the next peer section.
[[dynamic]]
section = "Scope and expected behavior"
pos = "after"
path = "languages/<language>.md"
source_section = "scope"

[[dynamic]]
section = "Red: observe the missing behavior"
pos = "after"
path = "languages/<language>.md"
source_section = "red"

[[dynamic]]
section = "Green: implement the increment"
pos = "after"
path = "languages/<language>.md"
source_section = "green"
