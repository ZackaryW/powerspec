[[attach.operations.archive.guidance]]
id = "flush-temporary-change-state"
body = """
After an OpenSpec change is successfully archived, run `pspec flush --change <archived-change-name>` from that change's owning repository. Run it only after archive success; do not clear temporal values when archive fails or is cancelled. Report cleanup failure separately from archive success and do not claim the values were cleared. Persistent `config.toml` values remain unchanged.
"""
